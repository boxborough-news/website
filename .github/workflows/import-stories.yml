# Imports the approved articles, events and notices from the editors' tracker sheet
# (Google Sheets) into the website: see scripts/import-from-sheet.js for the rules.
# Started with the "Import stories from the tracker sheet" button in Pages CMS, or from the
# Actions tab. Imported items are scheduled for their Friday (live at 6 a.m.) and appear on the
# Preview page right away, with a summary of the import.
name: Import stories from the tracker sheet

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload (filled in automatically)
        required: false
        type: string
      issue:
        description: "Only this issue date, e.g. 2026-10-30 (leave blank for everything approved for the coming weeks)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: import-stories
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tools for PDF flyers
        run: command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Import from the tracker sheet
        run: node scripts/import-from-sheet.js
        env:
          ISSUE: ${{ inputs.issue }}
      - name: Save the imported stories
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A src/articles src/announcements src/media src/_data/importReport.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Import stories from the tracker sheet"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Changes saved by this job don't start the publish job by themselves, so start it here.
      - name: Update the website and the Preview page
        if: steps.save.outputs.changed == 'true'
        run: gh workflow run publish.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
