# Every Friday morning (about 6:20 a.m.): build this week's newsletter and save it as a DRAFT in Kit.
# An editor then reviews it in Kit and presses Send. Nothing is sent automatically.
# Editors can also run this any time with the "Create this week's email draft now"
# button in Pages CMS. To try the whole email before a real Friday, run it from the
# GitHub Actions tab with "Test with the most recent issue" ticked.
name: Weekly newsletter draft

on:
  schedule:
    # Just after Friday's articles go live at 6 a.m. Two runs cover summer and winter time;
    # the later one does nothing if the first already made the draft, so edits made in Kit are kept.
    - cron: "20 10 * * 5" # Fridays, 6:20 a.m. Boston time in summer (5:20 a.m. in winter: too early, nothing yet)
    - cron: "20 11 * * 5" # Fridays, 6:20 a.m. Boston time in winter (7:20 a.m. in summer)
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload (filled in automatically)
        required: false
        type: string
      test:
        description: "Test with the most recent issue (makes a draft titled TEST – …)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse resized photos from earlier builds
        uses: actions/cache@v4
        with:
          path: _site/img
          key: img-${{ hashFiles('src/media/**') }}
          restore-keys: img-
      - run: npx eleventy --quiet
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: node scripts/create-newsletter-draft.js
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          NEWSLETTER_TEST: ${{ inputs.test && '1' || '' }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && '1' || '' }}
