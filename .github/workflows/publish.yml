# Builds the website and publishes it to GitHub Pages.
# Runs whenever an editor saves in Pages CMS, and again every morning so that
# articles scheduled for today appear and stale notices disappear.
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 9 * * *" # 5:15 a.m. Boston time (4:15 a.m. in winter)
    - cron: "15 17 * * *" # 1:15 p.m. Boston time, to pick up newly posted town meetings
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload (filled in automatically)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse resized photos from earlier builds
        uses: actions/cache@v4
        with:
          path: _site/img
          key: img-${{ hashFiles('src/media/**') }}
          restore-keys: img-
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
