# Pages CMS configuration: this file defines the forms editors see at app.pagescms.org.
# Docs: https://pagescms.org/docs/configuration/

media:
  input: src/media
  output: /media
  rename: safe
  categories: [image, document]

content:
  # ---------------------------------------------------------------- Articles
  - name: articles
    label: Articles (News & Features, last two months)
    type: collection
    path: src/articles
    format: yaml-frontmatter
    exclude: [articles.11tydata.js]
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      fields: [title, section, date, draft]
      primary: title
      sort: [date, title]
      search: [title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: section
        label: Section
        type: select
        required: true
        default: news
        options:
          values:
            - name: news
              label: News
            - name: features
              label: Features
      - name: date
        label: Publication date
        type: date
        required: true
        description: "Use the Friday of the issue. A future date schedules the article; it appears early that morning."
        options:
          format: yyyy-MM-dd
      - name: byline
        label: Byline (optional)
        type: string
        description: "For example: By Jane Smith"
      - name: summary
        label: Summary (optional)
        type: text
        description: "One or two sentences for the home page and the weekly email. Leave blank to use the article's opening lines."
      - name: image
        label: Main photo (optional)
        type: image
        description: "Shown at the top of the article, on the home page, in the weekly email and when shared on Facebook."
      - name: image_alt
        label: Photo description for screen readers
        type: string
        description: "Briefly describe what the photo shows, e.g. 'Children on the new swings at Flerra Meadows'."
      - name: image_fit
        label: How to show the main image
        type: select
        default: photo
        options:
          values:
            - name: photo
              label: Photo (may be trimmed to fit on the home page)
            - name: full
              label: Flyer, chart or logo (always shown whole)
      - name: image_focus
        label: Keep in view when trimmed
        type: select
        default: center
        description: "Home page and list pages trim photos to a standard shape. For a portrait, choose Top so heads aren't cut off."
        options:
          values:
            - name: center
              label: Center (most photos)
            - name: top
              label: Top (portraits, tall subjects)
            - name: bottom
              label: Bottom
      - name: image_caption
        label: Photo caption
        type: string
      - name: image_credit
        label: Photo credit
        type: string
        description: "Who took the photo."
      - name: top_story
        label: Top story
        type: boolean
        description: "Tick one story each week. It becomes the large lead story at the top of the home page and leads the email."
      - name: draft
        label: Draft (hide from website)
        type: boolean
        description: "While ticked, the article is saved but not published."
      - name: body
        label: Article text
        type: rich-text

  # ---------------------------------------------------- Events & community notices
  - name: past-articles
    label: "Archive: older articles (by year and month)"
    type: collection
    path: src/past-articles
    format: yaml-frontmatter
    exclude: [past-articles.11tydata.js]
    subfolders: true
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      fields: [title, section, date, draft]
      primary: title
      sort: [date, title]
      search: [title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: section
        label: Section
        type: select
        required: true
        default: news
        options:
          values:
            - name: news
              label: News
            - name: features
              label: Features
      - name: date
        label: Publication date
        type: date
        required: true
        description: "Use the Friday of the issue. A future date schedules the article; it appears early that morning."
        options:
          format: yyyy-MM-dd
      - name: byline
        label: Byline (optional)
        type: string
        description: "For example: By Jane Smith"
      - name: summary
        label: Summary (optional)
        type: text
        description: "One or two sentences for the home page and the weekly email. Leave blank to use the article's opening lines."
      - name: image
        label: Main photo (optional)
        type: image
        description: "Shown at the top of the article, on the home page, in the weekly email and when shared on Facebook."
      - name: image_alt
        label: Photo description for screen readers
        type: string
        description: "Briefly describe what the photo shows, e.g. 'Children on the new swings at Flerra Meadows'."
      - name: image_fit
        label: How to show the main image
        type: select
        default: photo
        options:
          values:
            - name: photo
              label: Photo (may be trimmed to fit on the home page)
            - name: full
              label: Flyer, chart or logo (always shown whole)
      - name: image_focus
        label: Keep in view when trimmed
        type: select
        default: center
        description: "Home page and list pages trim photos to a standard shape. For a portrait, choose Top so heads aren't cut off."
        options:
          values:
            - name: center
              label: Center (most photos)
            - name: top
              label: Top (portraits, tall subjects)
            - name: bottom
              label: Bottom
      - name: image_caption
        label: Photo caption
        type: string
      - name: image_credit
        label: Photo credit
        type: string
        description: "Who took the photo."
      - name: top_story
        label: Top story
        type: boolean
        description: "Tick one story each week. It becomes the large lead story at the top of the home page and leads the email."
      - name: draft
        label: Draft (hide from website)
        type: boolean
        description: "While ticked, the article is saved but not published."
      - name: body
        label: Article text
        type: rich-text

  # ---------------------------------------------------- Events & community notices
  - name: announcements
    label: Events & Notices
    type: collection
    path: src/announcements
    format: yaml-frontmatter
    exclude: [announcements.11tydata.js]
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      fields: [title, type, start_date, date, draft]
      primary: title
      sort: [date, start_date, title]
      search: [title, organizer]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Name the event or announcement. Leave the date out of the title; it is shown separately."
      - name: type
        label: Kind
        type: select
        required: true
        default: event
        options:
          values:
            - name: event
              label: Event (something people can attend on a date)
            - name: notice
              label: Community notice (news release, message or call for volunteers)
      - name: date
        label: Date posted
        type: date
        required: true
        description: "When it appears on the site and which Friday email it goes in. Use the Friday of the issue."
        options:
          format: yyyy-MM-dd
      - name: organizer
        label: Submitted by (organization)
        type: string
        description: "Shown as 'Submitted by …'. For example: Sargent Memorial Library"
      - name: start_date
        label: "Event: date (or first day)"
        type: date
        default: ""
        description: "Events stay listed until their last day has passed."
        options:
          format: yyyy-MM-dd
      - name: end_date
        label: "Event: last day (optional)"
        type: date
        default: ""
        description: "Only for events that run several days, such as a show's run or a weekly market. Leave blank for one-day events."
        options:
          format: yyyy-MM-dd
      - name: weekdays
        label: "Event: repeats on (optional)"
        type: select
        description: "For a run with a last day that happens on certain days each week, such as a Saturday market or a show Thursday to Sunday. The event is then listed on its next date."
        options:
          multiple: true
          values:
            - name: Mon
              label: Monday
            - name: Tue
              label: Tuesday
            - name: Wed
              label: Wednesday
            - name: Thu
              label: Thursday
            - name: Fri
              label: Friday
            - name: Sat
              label: Saturday
            - name: Sun
              label: Sunday
      - name: time
        label: "Event: time (optional)"
        type: string
        description: "For example: 7 p.m. · 10:30 a.m.–noon · 3–6 p.m. Written this way, it also goes into calendar apps."
      - name: location
        label: "Event: place (optional)"
        type: string
        description: "For example: Sargent Memorial Library, 427 Massachusetts Ave."
      - name: town
        label: "Event: town"
        type: string
        description: "Boxborough, Acton, Concord … Used for the Boxborough / Nearby towns filter. Write 'Online' for virtual events."
      - name: cost
        label: "Event: cost (optional)"
        type: string
        description: "For example: Free · $10; children under 12 free"
      - name: registration
        label: "Event: registration (optional)"
        type: string
        description: "For example: Required; register online"
      - name: sessions
        label: "Event: sessions of a series (optional)"
        type: object
        list: true
        description: "For a program series, add one entry per session. Each session is listed on its own date."
        fields:
          - name: date
            label: Date
            type: date
            options:
              format: yyyy-MM-dd
          - name: time
            label: Time
            type: string
          - name: title
            label: Session title
            type: string
          - name: location
            label: Place
            type: string
          - name: town
            label: Town
            type: string
      - name: link
        label: Link for more information (optional)
        type: string
        description: "The full web address. Readers can't click a QR code, so type the link here even if the flyer has one."
      - name: expires
        label: "Notice: remove after (optional)"
        type: date
        default: ""
        description: "For notices with a deadline (a survey, an application). The notice leaves the Notices page after this date."
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Summary (optional)
        type: text
        description: "One sentence for the weekly email. Leave blank to use the opening lines."
      - name: image
        label: Flyer or photo (optional)
        type: image
        description: "Shown below the details. Please also type the key details (date, place, link) in the text, since many readers can't read a flyer image."
      - name: image_alt
        label: Image description for screen readers
        type: string
      - name: image_fit
        label: How to show the image
        type: select
        default: full
        options:
          values:
            - name: photo
              label: Photo
            - name: full
              label: Flyer, chart or logo (always shown whole)
      - name: image_caption
        label: Caption or credit (optional)
        type: string
      - name: draft
        label: Draft (hide from website)
        type: boolean
      - name: body
        label: Details
        type: rich-text

  # ------------------------------------------------------- Town meetings note
  - name: townhall
    label: Town meetings note (optional)
    type: file
    path: src/_data/townhall.json
    format: json
    fields:
      - name: show
        label: Show a note above the town meetings list
        type: boolean
        description: "Optional. Use it when a meeting deserves a heads-up (a big vote, a public hearing). Most weeks, leave it off. The meetings list itself appears automatically either way."
      - name: heading
        label: Note heading (shown in the weekly email)
        type: string
        default: This week at Town Hall
      - name: body
        label: Note
        type: rich-text
        description: "A sentence or two about the week's most important meetings. Appears above the town meetings list on the home page, the Events page and in the email."
        options:
          media: false
      - name: hide_after
        label: Hide automatically after
        type: date
        default: ""
        description: "The note disappears the day after this date, so it never goes stale. Usually the next Saturday."
        options:
          format: yyyy-MM-dd
      - name: calendar_feed
        label: Town calendar feed (technical setting; leave as is)
        type: string
        description: "The iCal link for the Town of Boxborough's meetings calendar. Clear it to hide the meetings list."
      - name: calendar_link
        label: Link to the full town calendar (leave as is)
        type: string

  # --------------------------------------------------------- Weekly newsletter
  - name: newsletter
    label: Weekly email settings
    type: file
    path: src/_data/newsletter.json
    format: json
    fields:
      - name: subject
        label: Subject line
        type: string
        description: "{date} is replaced with the issue date, e.g. 'Boxborough News – {date}'."
      - name: intro
        label: Note at the top of this week's email (optional)
        type: text
        description: "Clear this after the email goes out, or it will appear again next week."
      - name: closing
        label: Closing line
        type: text
      - name: include_townhall
        label: Include upcoming town meetings
        type: boolean
        description: "The list of town meetings from the town calendar, plus the town meetings note when one is turned on."
      - name: include_events
        label: Include upcoming events
        type: boolean
      - name: kit_email_template_id
        label: Kit email template ID (set up once; leave as is)
        type: string

  # --------------------------------------------------------------- Pages
  - name: pages
    label: Pages (About, Contact …)
    type: collection
    path: src/pages
    format: yaml-frontmatter
    exclude: [pages.11tydata.js]
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, show_in_menu]
      primary: title
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: show_in_menu
        label: Show in the menu bar
        type: boolean
      - name: menu_order
        label: Position in menu
        type: number
        description: "Lower numbers appear further left."
      - name: subtitle
        label: Subtitle (optional)
        type: string
      - name: show_staff
        label: Show the staff box beside this page
        type: boolean
        description: "Used on About Us. Edit the names in 'Staff box'."
      - name: body
        label: Page text
        type: rich-text

  # ------------------------------------------------------------- Staff box
  - name: staff
    label: Staff box (About Us)
    type: file
    path: src/_data/staff.json
    format: json
    fields:
      - name: statement
        label: Statement at the top
        type: text
      - name: editors_in_chief
        label: Editors-in-Chief
        type: string
      - name: contributors
        label: Contributors
        type: text
        description: "Names separated by commas."
      - name: contact_email
        label: Contact email
        type: string

  # ------------------------------------------------ Events & notices page text
  - name: announcements_page
    label: Events & Notices page text
    type: file
    path: src/_data/announcements_page.json
    format: json
    fields:
      - name: disclaimer
        label: Submission policy line
        type: string
        description: "Shown on the Events and Notices pages and under each submitted item."
      - name: events_intro
        label: Events page introduction
        type: string
      - name: notices_intro
        label: Notices page introduction
        type: string

  # --------------------------------------------------------------- Settings
  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: title
        label: Site name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Short description (used by Google and in the footer)
        type: text
      - name: url
        label: Website address
        type: string
        description: "The full address, e.g. https://www.boxboroughnews.org. Links in the weekly email use this."
      - name: email
        label: Contact email
        type: string
      - name: tips_email
        label: News tips email
        type: string
      - name: facebook_url
        label: Facebook page link
        type: string
      - name: instagram_url
        label: Instagram link
        type: string
      - name: subscribe_url
        label: Newsletter sign-up link
        type: string
        description: "Where the 'Subscribe' buttons go (your email service's sign-up page)."
      - name: subscribe_embed_code
        label: Newsletter sign-up form code (optional)
        type: text
        description: "Paste the 'embed' HTML from your email service to show a sign-up form right on the site instead of a button. Leave blank to use the Sign-up page link above."
      - name: submit_form_url
        label: Event and notice submission form link (optional)
        type: string
        description: "A Google Form or similar. When blank, the Submit page offers a ready-made email instead."
      - name: print_partner_note
        label: Print partner note
        type: string
      - name: print_partner_url
        label: Print partner link
        type: string
      - name: town_resources
        label: Town resources (footer links)
        type: object
        list: true
        fields:
          - name: label
            label: Link text
            type: string
          - name: url
            label: Web address
            type: string

actions:
  - name: newsletter-draft
    label: Create this week's email draft now
    workflow: newsletter.yml
    ref: current
    confirm:
      title: Create email draft?
      message: This builds this week's newsletter and saves it as a draft in Kit. Nothing is sent.
      button: Create draft
  - name: archive-old
    label: Move older articles to the archive
    workflow: archive-old-articles.yml
    ref: current
    confirm:
      title: Move older articles to the archive?
      message: Moves articles more than two months old from the Articles list to the Archive list. This also happens automatically on the 1st of each month. Nothing changes on the website.
      button: Move articles
  - name: rebuild
    label: Rebuild the website
    workflow: publish.yml
    ref: current
    confirm: false
